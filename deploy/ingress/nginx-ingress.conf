# KELVIN Edge Ingress & Reverse Proxy Hardened Configuration

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream services in Zone 1 Private Subnets
upstream kelvin_api_upstream {
    server kelvin-api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream kelvin_frontend_upstream {
    server kelvin-frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# 1. Default Catch-All Server: Drop invalid or Host-Header Injected requests
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;

    # Drop connections from unapproved host headers immediately
    return 444;
}

# 2. HTTP to HTTPS Redirection Server
server {
    listen 80;
    server_name app.kelvinsecurity.io api.kelvinsecurity.io;

    # Enforce HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. KELVIN Frontend Application (app.kelvinsecurity.io)
server {
    listen 443 ssl;
    http2 on;
    server_name app.kelvinsecurity.io;

    # Modern TLS 1.2 / 1.3 configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Trusted proxy real IP handling (Zone 0 ALB CIDRs only)
    set_real_ip_from 10.0.0.0/16;
    set_real_ip_from 10.100.0.0/16;
    set_real_ip_from 10.200.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Hardened Security Response Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.kelvinsecurity.io wss://api.kelvinsecurity.io; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Request limits
    client_max_body_size 2M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Frontend SPA proxying
    location / {
        proxy_pass http://kelvin_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Block access to hidden files (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# 4. KELVIN API Control Plane (api.kelvinsecurity.io)
server {
    listen 443 ssl;
    http2 on;
    server_name api.kelvinsecurity.io;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set_real_ip_from 10.0.0.0/16;
    set_real_ip_from 10.100.0.0/16;
    set_real_ip_from 10.200.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Hardened API Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Limits
    client_max_body_size 10M;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Rate limiting for auth and token endpoints
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://kelvin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public API routing
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://kelvin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Strict isolation: block internal metrics and diagnostic endpoints from public
    location /metrics {
        # Allow internal cluster CIDR only
        allow 10.0.0.0/16;
        allow 10.100.0.0/16;
        allow 10.200.0.0/16;
        deny all;
        proxy_pass http://kelvin_api_upstream;
    }

    location /internal/ {
        deny all;
        return 403;
    }
}
