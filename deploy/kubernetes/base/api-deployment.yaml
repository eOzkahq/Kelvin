apiVersion: apps/v1
kind: Deployment
metadata:
  name: kelvin-api
  labels:
    app.kubernetes.io/name: kelvin-api
    app.kubernetes.io/component: control-plane
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kelvin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kelvin-api
        app.kubernetes.io/component: control-plane
        kelvin.security/zone: zone-1-app
    spec:
      serviceAccountName: kelvin-api-sa
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kelvin/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          env:
            - name: PORT
              value: "8080"
            - name: SHUTDOWN_TIMEOUT_S
              value: "30"
          envFrom:
            - configMapRef:
                name: kelvin-api-config
            - secretRef:
                name: kelvin-api-secrets
