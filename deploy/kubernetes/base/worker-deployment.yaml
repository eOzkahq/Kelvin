apiVersion: apps/v1
kind: Deployment
metadata:
  name: kelvin-worker
  labels:
    app.kubernetes.io/name: kelvin-worker
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 4
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kelvin-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kelvin-worker
        app.kubernetes.io/component: orchestrator
        kelvin.security/zone: zone-2-worker
    spec:
      serviceAccountName: kelvin-worker-sa
      # Extended grace period allowing workers to drain/checkpoint active scans
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: kelvin/worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 1000m
              memory: 1024Mi
            limits:
              cpu: 4000m
              memory: 4096Mi
          envFrom:
            - configMapRef:
                name: kelvin-worker-config
            - secretRef:
                name: kelvin-worker-secrets
