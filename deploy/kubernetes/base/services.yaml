apiVersion: v1
kind: Service
metadata:
  name: kelvin-api
  labels:
    app.kubernetes.io/name: kelvin-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kelvin-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kelvin-frontend
  labels:
    app.kubernetes.io/name: kelvin-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kelvin-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
