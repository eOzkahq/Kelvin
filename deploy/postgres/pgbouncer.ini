; KELVIN Production PgBouncer Configuration (Transaction Mode)

[databases]
kelvin = host=127.0.0.1 port=5432 dbname=kelvin auth_user=kelvin_admin

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction mode: Maximum connection reuse without leaking session state
pool_mode = transaction

; Connection limits
max_client_conn = 2000
default_pool_size = 80
min_pool_size = 20
reserve_pool_size = 10
reserve_pool_timeout = 5.0
max_db_connections = 120

; Timeouts & Hardening
server_reset_query = DISCARD ALL
server_check_delay = 30.0
server_check_query = SELECT 1
server_lifetime = 3600.0
server_idle_timeout = 600.0
client_idle_timeout = 300.0
query_timeout = 30.0
query_wait_timeout = 10.0
client_login_timeout = 15.0

; TLS Settings
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/server.key
client_tls_cert_file = /etc/pgbouncer/server.crt
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/ssl/certs/rds-combined-ca-bundle.pem
