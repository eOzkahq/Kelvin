id: security-txt
info:
  name: Security.txt Presence Check
  author: kelvin-security
  severity: info
  description: Verifies presence and format of security.txt reporting standard.
  classification:
    cwe-id:
      - CWE-200
  metadata:
    review_status: approved
    request_type: http-get
    safety_tier: passive-read
http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/security.txt"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "Contact:"
        part: body
