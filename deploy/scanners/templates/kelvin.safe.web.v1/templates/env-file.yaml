id: env-file
info:
  name: Environment File Exposure
  author: kelvin-security
  severity: high
  description: Detects exposure of environment configuration files (.env).
  classification:
    cwe-id:
      - CWE-200
  metadata:
    review_status: approved
    request_type: http-get
    safety_tier: passive-read
http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "DB_PASSWORD"
          - "APP_KEY"
          - "DATABASE_URL"
        part: body
        condition: or
