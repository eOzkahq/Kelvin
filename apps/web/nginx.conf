server {
    listen 80;
    server_name _;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' /services/kelvin/; script-src 'self' /services/kelvin/; style-src 'self' 'unsafe-inline' /services/kelvin/; img-src 'self' data: https: /services/kelvin/; font-src 'self' /services/kelvin/; connect-src 'self' /services/kelvin/api/;" always;

    root /usr/share/nginx/html;

    # Root redirect to subpath
    location = / {
        return 301 /services/kelvin/;
    }

    # API Proxy Routing
    location /services/kelvin/api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Hashed Static Assets (Immutable 1-year cache)
    location ~* ^/services/kelvin/assets/.*-[a-zA-Z0-9_-]+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Entry Point & HTML (Never cache index.html)
    location /services/kelvin/ {
        index index.html;
        try_files $uri $uri/ /services/kelvin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health Check Endpoint
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
