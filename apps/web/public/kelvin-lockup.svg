<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <!-- Brand Lockup: Functional Security Mark + Typography -->
  <defs>
    <radialGradient id="hBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="hScan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="hStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Left: The Functional Scope & Sandbox Emblem -->
  <g transform="translate(16, 10)">
    <!-- Container Plate: 120x120 -->
    <rect width="120" height="120" rx="28" fill="url(#hBg)" stroke="#1E293B" stroke-width="1.2" />

    <!-- Scope Grid Axes -->
    <line x1="60" y1="18" x2="60" y2="30" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="60" y1="90" x2="60" y2="102" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="18" y1="60" x2="30" y2="60" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="90" y1="60" x2="102" y2="60" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Concentric Scope Rings -->
    <circle cx="60" cy="60" r="40" stroke="#334155" stroke-width="1" stroke-dasharray="3 5" opacity="0.5" />
    <circle cx="60" cy="60" r="28" stroke="#1E293B" stroke-width="1" opacity="0.8" />

    <!-- 45° Scan Beam / Active Probe Sweep -->
    <path d="M 60 60 L 88 32 A 40 40 0 0 0 38 23 Z" fill="url(#hScan)" />

    <!-- Isolated Hexagon Sandbox Boundary -->
    <polygon points="60,33 84,47 84,73 60,87 36,73 36,47" 
             fill="#090D16" 
             fill-opacity="0.9"
             stroke="url(#hStroke)" 
             stroke-width="2.2" 
             stroke-linejoin="round" />

    <!-- Corner Reticle Bounds (Scope Enforcer) -->
    <path d="M 39 38 L 32 38 L 32 45" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 81 38 L 88 38 L 88 45" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 39 82 L 32 82 L 32 75" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 81 82 L 88 82 L 88 75" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Target Node & Identified Vuln Marker -->
    <circle cx="60" cy="60" r="8" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="60" cy="60" r="3.5" fill="#F8FAFC" />
    <circle cx="72" cy="50" r="2.2" fill="#38BDF8" />
  </g>

  <!-- Divider Line -->
  <line x1="168" y1="35" x2="168" y2="105" stroke="#1E293B" stroke-width="1.5" />

  <!-- Right: Typography & Specifier -->
  <g transform="translate(196, 0)">
    <!-- Primary Logotype -->
    <text x="0" y="74" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#FFFFFF">KELVIN</text>

    <!-- Tagline: What the product actually does -->
    <text x="2" y="98" 
          font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" 
          font-size="11.5" 
          font-weight="500" 
          letter-spacing="3.2" 
          fill="#38BDF8">AUTHORIZED SECURITY AUDITS</text>
  </g>
</svg>
