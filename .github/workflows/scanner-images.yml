name: Scanner runtime images

on:
  workflow_dispatch:
    inputs:
      zap_base_image:
        description: Official ghcr.io/zaproxy/zaproxy:stable reference pinned with @sha256
        required: true
        type: string
      zap_version:
        description: Exact ZAP version reported by the pinned base image
        required: true
        type: string
      nuclei_source_image:
        description: Official projectdiscovery/nuclei reference pinned with @sha256
        required: true
        type: string
      nuclei_version:
        description: Exact Nuclei version reported by the pinned source image
        required: true
        type: string
      distroless_base_image:
        description: gcr.io/distroless/static-debian12:nonroot reference pinned with @sha256
        required: true
        type: string
      publish:
        description: Whether to push built images to GitHub Container Registry (ghcr.io) and sign with Cosign
        required: false
        default: false
        type: boolean
      enable_ci:
        description: Explicitly permit CI workflow execution
        required: false
        default: true
        type: boolean
      platform:
        description: Target platform architecture (e.g. linux/arm64 or linux/amd64)
        required: false
        default: linux/arm64
        type: string

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, scan and harden scanner images
    if: inputs.enable_ci == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Inspect runner architecture and host environment
        shell: bash
        run: |
          echo "Host runner architecture: $(uname -m)"
          echo "Target build platform:   ${{ inputs.platform || 'linux/arm64' }}"

      - name: Set up QEMU for multi-arch emulation
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build, harden and smoke test scanner images
        env:
          ZAP_BASE_IMAGE: ${{ inputs.zap_base_image }}
          ZAP_VERSION: ${{ inputs.zap_version }}
          NUCLEI_SOURCE_IMAGE: ${{ inputs.nuclei_source_image }}
          NUCLEI_VERSION: ${{ inputs.nuclei_version }}
          DISTROLESS_BASE_IMAGE: ${{ inputs.distroless_base_image }}
          PLATFORM: ${{ inputs.platform || 'linux/arm64' }}
          OUT_DIR: artifacts/scanner-images
        run: bash scripts/scanners/build-images.sh

      - name: Scan ZAP image for vulnerabilities & generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # v0.31.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: kelvin/scanner-zap:${{ inputs.zap_version }}
          format: cyclonedx
          output: artifacts/scanner-images/zap.cdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Nuclei image for vulnerabilities & generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37 # v0.31.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: kelvin/scanner-nuclei:${{ inputs.nuclei_version }}
          format: cyclonedx
          output: artifacts/scanner-images/nuclei.cdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Record image inspection and metadata
        shell: bash
        env:
          ZAP_VERSION: ${{ inputs.zap_version }}
          NUCLEI_VERSION: ${{ inputs.nuclei_version }}
          ZAP_BASE_IMAGE: ${{ inputs.zap_base_image }}
          NUCLEI_SOURCE_IMAGE: ${{ inputs.nuclei_source_image }}
          DISTROLESS_BASE_IMAGE: ${{ inputs.distroless_base_image }}
        run: |
          docker image inspect "kelvin/scanner-zap:$ZAP_VERSION" "kelvin/scanner-nuclei:$NUCLEI_VERSION" \
            --format '{{.RepoTags}} {{.Id}} {{.Architecture}} {{.Os}} {{.Config.User}} {{json .Config.Labels}}' \
            > artifacts/scanner-images/image-inspect.txt

      - name: Verify release manifest governance
        shell: bash
        run: bash scripts/scanners/verify-release-manifest.sh deploy/scanners/images.lock.json

      - name: Save container images for release publishing
        if: ${{ inputs.publish == true }}
        shell: bash
        run: |
          mkdir -p artifacts/docker-images
          docker save \
            "kelvin/scanner-zap:${{ inputs.zap_version }}" \
            "kelvin/scanner-nuclei:${{ inputs.nuclei_version }}" \
            -o artifacts/docker-images/scanner-images.tar

      - name: Upload scanner container images
        if: ${{ inputs.publish == true }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: scanner-container-images
          path: artifacts/docker-images/scanner-images.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload scanner runtime image evidence
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: scanner-runtime-image-evidence
          path: artifacts/scanner-images/
          if-no-files-found: error
          retention-days: 90

  publish-and-sign:
    name: Publish, sign and attest scanner images
    needs: [build-and-scan]
    if: inputs.enable_ci == true && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download scanner runtime image evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: scanner-runtime-image-evidence
          path: artifacts/scanner-images

      - name: Download scanner container images
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: scanner-container-images
          path: artifacts/docker-images

      - name: Load scanner container images into Docker daemon
        shell: bash
        run: docker load -i artifacts/docker-images/scanner-images.tar

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR, sign with Cosign and attest supply chain
        shell: bash
        env:
          REPO: ${{ github.repository }}
          ZAP_VERSION: ${{ inputs.zap_version }}
          NUCLEI_VERSION: ${{ inputs.nuclei_version }}
          OUT_DIR: artifacts/scanner-images
        run: |
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          export REGISTRY_NAMESPACE="ghcr.io/$REPO_LOWER"
          bash scripts/scanners/publish-and-sign.sh

      - name: Verify release manifest governance
        shell: bash
        run: bash scripts/scanners/verify-release-manifest.sh deploy/scanners/images.lock.json

      - name: Upload scanner publication evidence
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: scanner-publication-evidence
          path: artifacts/scanner-images/published-manifest.json
          if-no-files-found: error
          retention-days: 90
