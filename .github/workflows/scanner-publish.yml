name: Scanner Approved Image Publication

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Approved Scanner Candidate Tag to Publish (e.g. v1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Simulate publication and verification without registry mutation'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scanner-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Pre-Publication Readiness Verification (Read-Only Least Privilege)
  # ----------------------------------------------------------------------------
  verify-readiness:
    name: Verify Release Readiness Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run Release Readiness Check
        run: |
          bash scripts/scanners/release-readiness-check.sh \
            --manifest deploy/scanners/images.lock.json \
            --candidate-tag "${{ github.event.inputs.candidate_tag }}"

  # ----------------------------------------------------------------------------
  # Job 2: Publication, Signing & Attestation (Gated by Environment Approval)
  # ----------------------------------------------------------------------------
  publish-and-certify:
    name: Publish Certified Scanners & Sign
    needs: [verify-readiness]
    runs-on: ubuntu-latest
    environment: scanner-release # Explicit maintainer approval gate required
    permissions:
      contents: write   # Update release manifest
      packages: write   # Push to GHCR
      id-token: write   # Sigstore Cosign OIDC signing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Log into GitHub Container Registry
        if: github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Publication, Signing, and Supply-Chain Attestation
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REGISTRY_NAMESPACE: 'ghcr.io/eozkull/kelvin'
        run: |
          bash scripts/scanners/publish-images.sh

      - name: Upload Published Manifest Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-manifest-evidence
          path: artifacts/scanner-images/published-manifest.json
          if-no-files-found: ignore
